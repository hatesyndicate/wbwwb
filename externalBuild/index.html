<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<base href="https://raw.githubusercontent.com/hatesyndicate/wbwwb/main/">
		<title>We become what we behold</title>
		<link rel="icon" type="image/png" href="https://ws.ankomstudios.com/icons/wbwwb/icon.png">
		<style>
			@font-face {
				font-family: 'Cairo';
				font-style: normal;
				font-weight: 400;
				src: url('https://raw.githubusercontent.com/hatesyndicate/wbwwb/main/css/Cairo-Regular.ttf') format('truetype');
			}

			html, body{
				width: 100%;
				height: 100%;
			}
			body{
				font-family: 'Cairo';
				margin: 0;
				background: #222;
				position:relative;
			}
			#stage{
				background: #000;
				width:100vw;
				height:100vh;
				height:100dvh;
				position:fixed;
				inset:0;
				cursor: none;
			}
			#stage canvas{
				display:block;
				width:100%;
				height:100%;
			}
			.overlay{
				display: none;
				text-align: center;
				color: #fff;
				letter-spacing: 1px;
				width:500px;
				height:170px;
				max-width:calc(100vw - 32px);
				box-sizing:border-box;
				position:absolute;
				margin:auto;
				top:0;
				left:0;
				right:0;
				bottom:0;
			}
			.overlay > div:nth-child(1){
				font-size: 100px;
				line-height: 100px;
			}
			.overlay > div:nth-child(2){
				font-size: 20px;
			}
			#modal_shade{
				display: none;
				background: rgba(0,0,0,0.8);
				width:100vw;
				height:100vh;
				height:100dvh;
				position:fixed;
				inset:0;
				cursor: pointer;
			}
			#paused{
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div id="stage"></div>
		<div id="modal_shade"></div>
		<div class="overlay" id="warning">
			<div dir="rtl"> Dad! </div>
			<div dir="rtl">
			your browser doesn't support webgl.<br>
			try a different browser or computer?<br>
			<br>
			Your browser is off! Use another browser or computer!
			</div>
		</div>
		<div class="overlay" id="paused">
			<div>paused</div>
			<div dir="rtl">
			click anywhere to resume<br>
			Click somewhere to return!
			</div>
		</div>

		<script>
			const gameScripts = [
				"js/lib/pixi.min.js",
				"js/lib/howler.js",
				"js/lib/stats.min.js",
				"js/lib/tweenjs-0.6.2.min.js",
				"js/lib/helpers.js",
				"js/textStrings.js",
				"js/core/Game.js",
				"js/core/SceneManager.js",
				"js/core/Scene.js",
				"js/game/World.js",
				"js/game/Camera.js",
				"js/game/Director.js",
				"js/game/Peep.js",
				"js/game/TV.js",
				"js/game/AnimationProp.js",
				"js/game/ScreenShake.js",
				"js/game/ScreenZoomOut.js",
				"js/game/Gore.js",
				"js/game/DeadBody.js",
				"js/game/Blood.js",
				"js/peeps/NormalPeep.js",
				"js/peeps/CrazyPeep.js",
				"js/peeps/NervousPeep.js",
				"js/peeps/SnobbyPeep.js",
				"js/peeps/AngryPeep.js",
				"js/peeps/HatPeep.js",
				"js/peeps/LoverPeep.js",
				"js/peeps/ProtestAnim.js",
				"js/peeps/HelpingAnim.js",
				"js/peeps/HappyWeirdoPeep.js",
				"js/peeps/EvilHatPeep.js",
				"js/peeps/PanicPeep.js",
				"js/peeps/MurderPeep.js",
				"js/misc/Candlelight.js",
				"js/misc/LoversWatching.js",
				"js/misc/Cricket.js",
				"js/misc/Cursor.js",
				"js/scenes/Scene_Preloader.js",
				"js/scenes/Scene_Quote.js",
				"js/scenes/Scene_Game.js",
				"js/scenes/Scene_Credits.js",
				"js/scenes/Scene_Post_Credits.js",
				"js/scenes/Scene_Post_Post_Credits.js",
				"js/scenes/Scene_EndPrototype.js",
				"js/scenes/Act_I.js",
				"js/scenes/Act_II.js",
				"js/scenes/Act_III.js",
				"js/scenes/Scene_Meta.js"
			];

			function loadScript(path) {
				return fetch(new URL(path, document.baseURI))
					.then(function(response) {
						if (!response.ok) {
							throw new Error("HTTP " + response.status + " loading " + path);
						}
						return response.text();
					})
					.then(function(source) {
						return new Promise(function(resolve, reject) {
							var script = document.createElement("script");
							var blobUrl = URL.createObjectURL(new Blob([source], {
								type: "text/javascript"
							}));
							script.onload = function() {
								URL.revokeObjectURL(blobUrl);
								resolve();
							};
							script.onerror = function() {
								URL.revokeObjectURL(blobUrl);
								reject(new Error("Could not execute " + path));
							};
							script.src = blobUrl;
							document.head.appendChild(script);
						});
					});
			}

			function initializeGame() {
				try{
					Game.init();
				}catch(e){
					document.getElementById("warning").style.display = "block";
				}
			}

			window.SHARE_TEXT = 'I just played a very scary game right now'
			window.SHARE_URL = "";

			(async function() {
				try {
					for (var i = 0; i < gameScripts.length; i++) {
						var path = gameScripts[i];
						if (path === "js/lib/tweenjs-0.6.2.min.js") {
							window.createjs = window;
						}
						await loadScript(path);
						if (path === "js/lib/tweenjs-0.6.2.min.js") {
							Ticker.framerate = 60;
							Ticker.paused = true;
						}
					}
					Game.stats = false;
					initializeGame();
				} catch (error) {
					console.error("Unable to load the game from GitHub:", error);
					var warning = document.getElementById("warning");
					warning.style.display = "block";
					var message = document.createElement("div");
					message.textContent = "The game could not load. Check your internet connection and refresh.";
					warning.appendChild(message);
				}
			})();
		</script>
	</body>
</html>
